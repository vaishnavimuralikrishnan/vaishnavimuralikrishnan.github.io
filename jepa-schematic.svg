<svg viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
  <rect x="0" y="0" width="600" height="380" fill="#e8e4d6"/>

  <!-- panel divider -->
  <line x1="300" y1="30" x2="300" y2="350" stroke="#c7c0ac" stroke-width="1"/>

  <!-- Left panel: latent trajectory before intervention -->
  <text x="30" y="40" fill="#4a5064" font-size="11" letter-spacing="1">LATENT ROLLOUT</text>
  <rect x="30" y="60" width="240" height="180" fill="none" stroke="#c7c0ac" stroke-width="1"/>
  <!-- trajectory path before intervention -->
  <path d="M 50 200 Q 90 150 130 140 Q 160 135 175 130" fill="none" stroke="#37607a" stroke-width="2"/>
  <circle cx="50" cy="200" r="4" fill="#37607a"/>
  <circle cx="175" cy="130" r="5" fill="#37607a"/>
  <!-- intervention jump -->
  <line x1="175" y1="130" x2="230" y2="90" stroke="#b5551f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="230" cy="90" r="5" fill="#b5551f"/>
  <text x="180" y="112" fill="#b5551f" font-size="10">edit</text>
  <!-- trajectory continues coherently after intervention -->
  <path d="M 230 90 Q 245 100 250 120 Q 255 145 245 165" fill="none" stroke="#b5551f" stroke-width="2"/>
  <circle cx="245" cy="165" r="4" fill="#b5551f"/>
  <text x="50" y="255" fill="#4a5064" font-size="10">rollout continues coherently</text>
  <text x="50" y="270" fill="#4a5064" font-size="10">from the edited state</text>

  <!-- Right panel: pixel trajectory -->
  <text x="330" y="40" fill="#4a5064" font-size="11" letter-spacing="1">PIXEL ROLLOUT</text>
  <rect x="330" y="60" width="240" height="180" fill="none" stroke="#c7c0ac" stroke-width="1"/>
  <path d="M 350 200 Q 390 150 430 140 Q 460 135 475 130" fill="none" stroke="#1c2230" stroke-width="2" stroke-opacity="0.55"/>
  <circle cx="350" cy="200" r="4" fill="#1c2230" fill-opacity="0.55"/>
  <circle cx="475" cy="130" r="5" fill="#1c2230" fill-opacity="0.55"/>
  <!-- broken/incoherent path after attempted edit -->
  <line x1="475" y1="130" x2="520" y2="95" stroke="#b5551f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="520" cy="95" r="5" fill="#b5551f" fill-opacity="0.5"/>
  <path d="M 520 95 Q 500 130 540 150 Q 560 170 515 190" fill="none" stroke="#b5551f" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="2 3"/>
  <text x="350" y="255" fill="#4a5064" font-size="10">no manipulable state —</text>
  <text x="350" y="270" fill="#4a5064" font-size="10">edits break the sequence</text>

  <text x="30" y="360" fill="#8a8368" font-size="10">schematic — two-body elastic collision, JEPA vs. pixel-space transformer</text>
</svg>
